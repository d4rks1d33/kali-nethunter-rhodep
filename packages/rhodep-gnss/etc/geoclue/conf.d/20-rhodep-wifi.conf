# rhodep: network geolocation for a phone with no usable GNSS and no SIM.
#
# Background. This phone's satellite GNSS is unusable: starting the measurement
# engine power-cycles the SoC. Cell-id positioning *through the modem's own LOC
# service* works, but only once the modem has a serving cell it can resolve,
# and with an unprovisioned SIM it never registers. That leaves two sources
# that need neither: WiFi access points, and the identity of the cells the
# modem can hear (which it decodes while searching, registered or not). Both
# are handled by rhodep-gnss-daemon and arrive here as NMEA; see
# [network-nmea] below.
#
# geoclue's [wifi] source sends the BSSIDs it can see to an Ichnaea-compatible
# geolocation service. geoclue 2.8 (Kali 2.8.1-1) already compiles in BeaconDB
# as its default -- the Mozilla Location Service it used to default to shut down
# for good in 2024 -- so this is mostly making that explicit and pinning it.

[wifi]
# DISABLED, and this is the important line in this file. MEASURED, 2026-09-05,
# with this source enabled and pointed at BeaconDB exactly as it was above:
#
#   $ geoclue client, default RequestedAccuracyLevel
#   lat=-32.8941526 lon=-60.9068000 accuracy=26000m desc='ipf fallback (from WiFi data)'
#
# 26 km, and 4 km from where the phone actually is. That is the IP-address
# fallback: geoclue's WiFi source does not send "considerIp": false, so when
# the service cannot match the BSSIDs it geolocates the ISP instead and
# answers HTTP 200 with a real-looking position and a "fallback":"ipf" field.
# geoclue passes it on. [ip] below is disabled for exactly this reason; leaving
# [wifi] on let the same answer in through the back door, and it was winning,
# because a client that has not asked for EXACT accuracy never gets the
# network-nmea source at all (see below) and this was the only source left.
#
# Nothing is lost by turning it off. rhodep-gnss-daemon scans the same
# neighbourhood and asks the same services, but with "considerIp": false, with
# a second provider to fall back on when BeaconDB has no coverage here, with
# _nomap access points excluded, and refusing ipf/lacf answers outright.
# MEASURED at the same moment as the 26 km answer above: 22 m. Leaving this
# source on also meant two independent BSSID lists leaving the phone every
# minute instead of one.
enable=false

# Kept for reference. If you ever re-enable the source above, this is the URL
# it should use: BeaconDB, public domain, opt-in collection, no API key.
url=https://api.beacondb.net/v1/geolocate

# MEASURED, 2026-09-05, Rosario/AR: BeaconDB answers 404 "no location could be
# estimated" for every BSSID in range here, and for the serving GSM cell too.
# It is a young database and large parts of the world are simply not in it yet,
# so this source will produce nothing at this location until somebody surveys
# it. That is not a misconfiguration and the URL above is not wrong.
#
# What actually produces a position on this phone is [network-nmea] below,
# reading rhodep-gnss-daemon, which queries BeaconDB first and falls back to
# Positon when BeaconDB has no coverage. Doing the fallback in the daemon
# rather than here is deliberate: geoclue's [wifi] source takes exactly one
# URL and cannot fail over.
#
# If you would rather have geoclue's own WiFi source work standalone, without
# the daemon, comment out the BeaconDB url above and uncomment this one. It is
# the same service and the same key that Kali's stock /etc/geoclue/geoclue.conf
# offers in its commented-out example; Positon ask that only non-commercial
# distributions enable it by default and name Debian as qualifying.
#url=https://api.positon.xyz/v1/geolocate?key=56aba903-ae67-4f26-919b-15288b44bda9

# Do not upload our observations. Submission would need a trustworthy GPS fix
# to tie the BSSIDs to, and the only fix this phone can produce is itself
# derived from a geolocation service. Feeding that back in would be laundering
# a guess into the database as if it were ground truth.
submit-data=false

# Take the position from rhodep-gnss-daemon's NMEA socket.
#
# The daemon is the piece that scans WiFi, reads the modem's cell list and
# queries the geolocation services directly. It deliberately does NOT ask
# geoclue where it is -- geoclue is reading the daemon here, so that would be a
# loop -- and it never opens the QMI LOC service unless the modem is actually
# registered. (It does allocate a QMI NAS client to read cell identities; NAS
# is a read of measurements the radio already made and cannot start the GNSS
# engine.)
#
# NOTE on accuracy. geoclue derives accuracy from $GPGGA's HDOP field, and
# gclue_location_get_accuracy_from_hdop() saturates at 300 m -- there is no
# HDOP that means "1200 m". The daemon therefore refuses to publish any fix
# coarser than 300 m rather than let geoclue under-report it; see
# --max-nmea-accuracy in /usr/share/doc/rhodep-gnss/README. WiFi fixes here are
# ~23 m (geoclue says 50 m) and cell-tower fixes ~250 m (geoclue says 300 m).
#
# CLIENTS MUST ASK FOR EXACT ACCURACY. This is not obvious and it cost an
# afternoon. geoclue deliberately refuses to start a source that is *more*
# accurate than the client asked for -- that is the privacy and power trade it
# exists to make -- and the NMEA source reports accuracy level 8 (EXACT):
#
#   Available accuracy level from GClueNMEASource: 8
#   Available accuracy level from GClueWifi: 6
#   Available accuracy level from GClue3G: 5
#   GClueNMEASource already inactive, not stopping.      <- never started
#
# So a client that leaves RequestedAccuracyLevel at anything below 8 never
# connects to this socket, whatever is in this file. Set it:
#
#   org.freedesktop.GeoClue2.Client.RequestedAccuracyLevel = 8
#
# and geoclue connects to /run/gnss-share.sock and reports
# desc='GPS GGA+RMC' with accuracy 50 m for a 22 m fix. Verified, 2026-09-05.
[network-nmea]
enable=true
nmea-socket=/run/gnss-share.sock

# geoclue's modem-gps source is off on purpose. It asks ModemManager to enable
# location, ModemManager enables GNSS unassisted, and on this SoC an unassisted
# GNSS session power-cycles the phone.
[modem-gps]
enable=false

# The IP source resolves to whatever city the ISP peers in -- 25 km of
# "accuracy" here. geoclue will always prefer a better source when one exists,
# but leaving this on means an application that asks for a location gets a
# plausible-looking wrong answer whenever WiFi geolocation is unavailable,
# which on this phone is the failure mode we are actually trying to fix.
#
# The same answer is what an Ichnaea service returns when you forget
# "considerIp": false -- HTTP 200, real-looking coordinates, and a
# "fallback":"ipf" field that is the only thing distinguishing it from a fix.
# The daemon always sends considerIp:false and refuses ipf/lacf replies.
[ip]
enable=false

# Command-line tools have no .desktop file and no agent, so without an entry
# here geoclue waits for an agent authorization that never comes and the client
# hangs until it times out. system=true marks these as OS components so no
# agent is consulted.
[rhodep-locate]
allowed=true
system=true
users=

[gpspipe]
allowed=true
system=true
users=

[cgps]
allowed=true
system=true
users=

[where-am-i]
allowed=true
system=true
users=

[geoclue-demo-agent]
allowed=true
system=true
users=
