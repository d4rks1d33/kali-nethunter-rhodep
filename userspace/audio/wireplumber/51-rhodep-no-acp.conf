# The card's PCMs are DPCM front ends: they only open once a route has been
# enabled, so ACP's probing finds nothing and builds no profile at all. Expose
# the PCM directly instead and let UCM hold the routing.
monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "alsa_card.platform-sound"
      }
    ]
    actions = {
      update-props = {
        api.alsa.use-acp = false
      }
    }
  }
]
