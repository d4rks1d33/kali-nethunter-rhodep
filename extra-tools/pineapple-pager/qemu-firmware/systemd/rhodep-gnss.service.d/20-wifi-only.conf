# Pager bridge: force WiFi-only GPS. --source auto was selecting qmi-cellid,
# which (a) emits void NMEA (no fix -> gpsd mode:1) and (b) touches the modem.
# WiFi source never touches the modem and emits a real fix. GPS == WiFi only.
[Service]
ExecStart=
ExecStart=/usr/local/sbin/rhodep-gnss-daemon --source wifi --socket /run/gnss-share.sock --tcp 2948
