; php-fpm pool for the WiFi Pineapple panel (Kali/NetHunter aarch64 port).
;
; Part of: extra-tools/pineapple-port/net/
;
; Install: drop this into the php-fpm pool dir, e.g.
;   /etc/php/8.3/fpm/pool.d/pineapple.conf
; then restart php-fpm:  systemctl restart php8.3-fpm
;
; The panel shells out to a lot of tools (uci, pineap, iw, curl, systemctl via
; the init.d shim, etc.). The compat/ shims MUST be first on this pool's PATH so
; `uci`, `uclient-fetch`, `opkg`, `wifi`, `iwinfo` resolve to our shims and not
; to any system binary. We also point the uci store at /opt/pineapple/etc/uci.

[pineapple]

; Run as the panel user. For the device you may want a dedicated 'pineapple'
; user; root is acceptable on a single-purpose pentest device (the original
; firmware runs the panel as root). Adjust to taste.
user  = root
group = root

; Unix socket consumed by net/nginx.conf (upstream pineapple_php).
listen = /run/php/php-fpm-pineapple.sock
listen.owner = root
listen.group = root
listen.mode  = 0660

pm = dynamic
pm.max_children      = 8
pm.start_servers     = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests      = 500

; --- Environment: put the compat shims first on PATH, set the UCI store dir ---
; /opt/pineapple/compat holds: uci, uclient-fetch, opkg, wifi, iwinfo, led,
; logread, resetssids (resetssids & wifi are also symlinked to their absolute
; paths /usr/sbin/resetssids and /sbin/wifi, which the panel calls directly).
; /usr/sbin/pineapd and /usr/bin/pineap are the native pineapd-ng / pineap-ng.
env[PATH]             = /opt/pineapple/compat:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
env[PINEAPPLE_UCI_DIR] = /opt/pineapple/etc/uci
; AP (hostapd) interface used by pineap-ng for `hostapd_cli -i <iface>` on
; karma/ssid_filter/mac_filter. This MUST match the interface hostapd runs the
; Pineapple AP on (on the G82 this is the TP-Link Archer USB adapter). pineap-ng
; On the G82: the TP-Link Archer USB adapter = wlan1 (AP), internal WiFi = wlan0
; (monitor, as wlan0mon in pineap.@config[0].pineap_interface).
; change this only if your AP adapter enumerates under a different name.
env[PINEAP_IFACE]      = wlan1

; Sessions live under /opt so nothing touches the OS outside /opt.
php_admin_value[session.save_path] = /opt/pineapple/etc/sessions

; The panel uses exec() heavily -- do NOT disable it.
php_admin_value[disable_functions] =

; Reasonable limits for module uploads.
php_admin_value[upload_max_filesize] = 64M
php_admin_value[post_max_size]       = 64M
php_admin_value[max_execution_time]  = 120

; Log to the port's own dir.
php_admin_value[error_log] = /var/log/pineapple/php-fpm.log
catch_workers_output = yes
