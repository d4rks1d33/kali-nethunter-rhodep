# pineapd-pager config
# -- managed by pineapd-pager; edited values survive reloads via cmd 311/313 --
#
# Radios (ARQUITECTURA-PORT.md §3):
#   internal_iface = the phone's STA/AP radio (WCN3990). NEVER monitor.
#   monitor_iface  = the dedicated Archer USB monitor (wlan1 -> wlan1mon).
#   sta_scan_interface = managed iface used for native off-channel recon scan
#                        (empty => auto-detect the connected managed STA).
internal_iface = wlan0
monitor_iface = wlan1mon
sta_scan_interface =

# Recon
recon = off
reconpath = /opt/pineapple-pager/run/recon.db
reconname = pager

# Paths
handshakepath = /opt/pineapple-pager/run/handshakes
payloads = /opt/pineapple-pager/payloads
wiglepath = /opt/pineapple-pager/run/wigle
pcappath = /opt/pineapple-pager/run/pcaps
hostapd_db_path = /opt/pineapple-pager/run/log.db
ssid_db_path = /opt/pineapple-pager/run/pineapple.db

# PineAP / behaviour
inject = on
hop = on
channel = 0
bands = 2.4,5
ssid_collect = off
broadcast_ssid_pool = off
karma = off

# gpsd (fix=0 reported cleanly when gpsd is absent)
gpsd_host = 127.0.0.1
gpsd_port = 2947
