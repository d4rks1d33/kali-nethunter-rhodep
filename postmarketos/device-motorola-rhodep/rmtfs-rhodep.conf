# Drop-in: does not replace Alpine's unit, only changes its arguments.
#
# rmtfs needs these flags on rhodep, otherwise the modem never finishes init:
#   -P  usar particiones reales (by-partlabel) en vez de archivos
#   -s  sincronizar al salir
#
# CORRECTED 2026-09-06, for the same reason as
# packages/rhodep-modem-support/usr/lib/systemd/system/rmtfs.service.d/10-rhodep.conf
# and userspace/modem/install.sh. This file used to pass -r, described as
# "-r  read/write the modem's EFS partitions". That is backwards:
#
#   rmtfs.c:526    case 'r': read_only = true;
#   storage.c:89   if (!storage_read_only) fd = open(fspath, O_RDWR);
#                  else storage_populate_shadow_buf(...)   # opens O_RDONLY
#   storage.c:246  if (!storage_read_only) return pwrite(...);
#                  ... memcpy into a realloc'd shadow buffer instead
#   storage.c:274  if (storage_read_only) return 0;        # storage_sync()
#
# So -r makes the EFS read-ONLY, backed by a per-open RAM shadow whose writes
# are acknowledged and then thrown away, and whose fdatasync is a no-op that
# returns success. The modem cannot tell, which is what makes it nasty.
#
# This is the postmarketOS copy of the drop-in and is the ONLY one on a pmOS
# install -- there is no /etc/systemd/system override there the way there is
# on the Kali image -- so unlike the Debian package copy, this one really was
# taking effect. With -r the modem's UIM provisioning session does not survive
# a reboot and the SIM stops at 'detected', and nothing the positioning engine
# calibrates or is given is ever kept.
#
# The empty ExecStart clears the inherited one; without it systemd rejects the
# tener dos ExecStart en un servicio Type=simple.
[Service]
ExecStart=
ExecStart=/usr/bin/rmtfs -P -s
