; php-fpm-pineapple-main.conf -- MAIN php-fpm config for the dedicated master.
;
; Part of: extra-tools/pineapple-port/net/   (FASE 4)
;
; pineapple-php-fpm.service runs a DEDICATED php-fpm master with this file as its
; --fpm-config. It provides the [global] section (required by a master) and then
; `include`s the actual pool definition (php-fpm-pineapple.conf). This way the
; port owns its php-fpm entirely and never touches the system php-fpm instance.
;
; (Alternatively, php-fpm-pineapple.conf can be dropped straight into the system
;  pool dir /etc/php/<ver>/fpm/pool.d/ -- the installer supports both; the
;  dedicated-master path is the on-demand, no-OS-impact default.)

[global]
pid = /run/php/pineapple-php-fpm.pid
error_log = /var/log/pineapple/php-fpm.log
daemonize = no

; Pull in the pool (compat shims on PATH, UCI dir, unix socket, etc.)
include=/opt/pineapple/net/php-fpm-pineapple.conf
