# Things that should keep the phone awake while they run.
#
# One per line:
#   unit:NAME.service   a systemd service, matched with systemctl is-active
#   proc:NAME           a process, by exact binary name (pgrep -x)
#   procf:PATTERN       a process, matched anywhere in its command line
#
# Prefer proc:. procf: also matches any shell that merely mentions the name,
# so a terminal where you typed the command counts as the command running --
# which will hold the phone awake long after the job is gone. Use it only for
# things with no binary of their own, like a python script.
#
# Nothing is listed by default on purpose. A phone that never sleeps because
# something looked busy goes flat by lunchtime, and it does it silently. Add
# what you actually leave running.
#
# Examples, commented out:
#
# unit:bettercap.service
# proc:wireshark
# proc:dumpcap
# proc:airodump-ng
# proc:tcpdump
