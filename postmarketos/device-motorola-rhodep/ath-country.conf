# Unlock 5 GHz TX on WCN3990.
#
# WCN3990 ships with EEPROM regdomain 0x406c (world-roaming). Without an
# override, ath_common's ath_regd_init_wiphy installs a custom regdom
# that hardcodes NL80211_RRF_NO_IR on every 5 GHz channel -- passive-scan
# only, TX blocked. `iw reg set US` is silently rejected because
# CONFIG_ATH_REG_DYNAMIC_USER_REG_HINTS defaults to N.
#
# The ath.country= param (added by patch, see
# kernel/patches/wip-rhodep-5ghz-unlock/) both rewrites current_rd at
# module load AND installs a permissive custom regdom without NO_IR on
# UNII-1 (5170-5250) and UNII-3 (5725-5850). DFS is left disabled --
# mainline ath10k WCN3990 has no production DFS support.
#
# Change to your local country code if AR/JP/BR/etc CTL profile matters.
options ath country=US
