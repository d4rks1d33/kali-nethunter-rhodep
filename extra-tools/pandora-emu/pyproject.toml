[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pandora-emu"
version = "0.1.0"
description = "Pandora D650 keyfob emulator (GTK4/libadwaita) with a HackRF bridge"
readme = "README.md"
license = { text = "GPL-2.0-or-later" }
requires-python = ">=3.10"

# numpy powers the vectorised real-time RX demod and TX I/Q synthesis in
# hackrf.py (per-sample Python loops were far too slow for streaming SDR).
dependencies = ["numpy>=1.21"]

[project.scripts]
pandora-emu = "pandora_emu.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Ship the compiled core, the CSS, and the C sources (so the lib can be rebuilt
# on the target from the installed package if needed).
pandora_emu = [
    "style.css",
    "libpandora.so",
    "native/*.c",
    "native/*.h",
    "native/Makefile",
]
