[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pandora-emu"
version = "0.1.0"
description = "Pandora D-605 keyfob emulator (GTK4/libadwaita) with a HackRF bridge"
readme = "README.md"
license = { text = "GPL-2.0-or-later" }
requires-python = ">=3.10"

# Optional: direct libhackrf bindings. The app works without it (it shells out
# to hackrf_transfer by default); install this extra and flip USE_PYHACKRF in
# hackrf.py to use the direct backend.
[project.optional-dependencies]
pyhackrf = ["pyhackrf"]

[project.scripts]
pandora-emu = "pandora_emu.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Ship the compiled core, the CSS, and the C sources (so the lib can be rebuilt
# on the target from the installed package if needed).
pandora_emu = [
    "style.css",
    "libpandora.so",
    "native/*.c",
    "native/*.h",
    "native/Makefile",
]
