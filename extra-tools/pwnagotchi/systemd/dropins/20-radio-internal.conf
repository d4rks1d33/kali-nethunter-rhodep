# Drop-in for the INTERNAL radio (wlan0/mon0) mode.
#
# Install with the same name to BOTH units, and reload:
#   /etc/systemd/system/rhodep-pwn-bettercap.service.d/20-radio.conf
#   /etc/systemd/system/rhodep-pwngrid-peer.service.d/20-radio.conf
#   systemctl daemon-reload
# Then: systemctl start rhodep-pwnagotchi.service
#
# Remove both files + daemon-reload to go back to the external (wlan1) radio.
#
# The NetHunter Pro app writes/removes these files for you when you flip the
# radio selector on the pwnagotchi screen — same drop-in pattern the app uses
# for the manual/auto mode switch.
[Service]
Environment=RHODEP_PWN_RADIO=internal
