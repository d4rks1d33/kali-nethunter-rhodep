# nginx.conf -- WiFi Pineapple panel, native Kali/NetHunter aarch64 port.
user root root;
#
# Part of: extra-tools/pineapple-port/net/
#
# The ORIGINAL firmware nginx.conf is not in the panel source tree (it ships in
# the OpenWrt firmware root), so this file is written fresh for the port.
#
# WHAT IT DOES:
#   - listens on :1471 (the Pineapple panel port)
#   - doc-root = /pineapple  (a symlink to /opt/pineapple/panel created by the
#     installer; the panel hardcodes /pineapple everywhere -- API.php:98 glob,
#     require '/pineapple/api/...', module includes -- so we symlink instead of
#     editing dozens of require() paths)
#   - routes /api and /api/ to the panel's api/index.php front controller
#   - passes .php to php-fpm over a unix socket (see net/php-fpm-pineapple.conf)
#   - the anti-JSON-hijacking prefix  )]}',\n  is emitted by the PHP itself
#     (API.php finalize()), so nginx does nothing special for it.
#
# INSTALL: include this file from the main nginx, or run a dedicated nginx with
#   nginx -c /opt/pineapple/net/nginx.conf
# The installer creates:  ln -sf /opt/pineapple/panel /pineapple
#
# Adjust `fastcgi_pass` if you use a TCP socket (127.0.0.1:9000) instead of the
# unix socket; both variants are shown.

worker_processes  1;
pid               /run/pineapple-nginx.pid;
error_log         /var/log/pineapple/nginx-error.log;

events {
    worker_connections  128;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log  /var/log/pineapple/nginx-access.log;

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 64m;   # module uploads (ModuleManager / firmware)

    # php-fpm upstream. Prefer the unix socket created by the pool conf.
    # TCP alternative: upstream pineapple_php { server 127.0.0.1:9000; }
    upstream pineapple_php {
        server unix:/run/php/php-fpm-pineapple.sock;
    }

    server {
        listen       1471;
        listen       [::]:1471;
        server_name  _;

        root   /pineapple;      # -> /opt/pineapple/panel (symlink)
        index  index.html;

        # Harden a bit: never serve the API/module PHP class files directly,
        # only the front controllers.
        location ~ ^/(api|modules)/.*/(?!index)\.php$ {
            return 404;
        }

        # API front controller. The AngularJS frontend POSTs to /api/ and GETs
        # /api?download=<token>. Map both to api/index.php.
        location = /api {
            include        /etc/nginx/fastcgi_params;
            fastcgi_param  SCRIPT_FILENAME  $document_root/api/index.php;
            fastcgi_param  QUERY_STRING     $query_string;
            fastcgi_pass   pineapple_php;
        }
        location = /api/ {
            include        /etc/nginx/fastcgi_params;
            fastcgi_param  SCRIPT_FILENAME  $document_root/api/index.php;
            fastcgi_param  QUERY_STRING     $query_string;
            fastcgi_pass   pineapple_php;
        }

        # Generic PHP (module landing pages, dumpscan.php, etc.)
        location ~ \.php$ {
            try_files      $uri =404;
            include        /etc/nginx/fastcgi_params;
            fastcgi_param  SCRIPT_FILENAME  $document_root$fastcgi_script_name;
            fastcgi_pass   pineapple_php;
            fastcgi_read_timeout 120;
        }

        # Static assets + SPA fallback to index.html for client-side routes.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
