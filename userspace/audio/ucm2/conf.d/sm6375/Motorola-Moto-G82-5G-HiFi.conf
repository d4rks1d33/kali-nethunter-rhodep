SectionVerb {
	EnableSequence [
		cset "name='SEC_MI2S_RX Audio Mixer MultiMedia1' 0"
	]

	DisableSequence [
		cset "name='SEC_MI2S_RX Audio Mixer MultiMedia1' 0"
	]

	Value {
		TQ "HiFi"
	}
}

# Both amplifiers hang off Secondary MI2S and play together: 0x34 is the
# loudspeaker at the bottom and 0x35 the earpiece, used as the second channel.
SectionDevice."Speaker" {
	Comment "Speaker"

	EnableSequence [
		cset "name='Speaker PCM Playback Volume' 360"
		cset "name='Earpiece PCM Playback Volume' 360"
		cset "name='SEC_MI2S_RX Audio Mixer MultiMedia1' 1"
	]

	DisableSequence [
		cset "name='SEC_MI2S_RX Audio Mixer MultiMedia1' 0"
	]

	Value {
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels "2"
		PlaybackPriority 100
	}
}
