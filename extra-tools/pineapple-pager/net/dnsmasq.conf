# dnsmasq.conf -- dedicated DHCP/DNS for the Pineapple LAN (br-lan).
#
# Part of: extra-tools/pineapple-port/net/   (FASE 4)
#
# This is a DEDICATED dnsmasq instance for the Pineapple LAN ONLY. It is NOT the
# system dnsmasq: pineapple-dnsmasq.service starts dnsmasq with
#   --conf-file=/opt/pineapple/net/dnsmasq.conf
# and binds ONLY to br-lan, so it can never interfere with the phone's own
# networking/DNS.
#
# Reverse-engineered intent (original firmware served DHCP to victims on
# 172.16.42.0/24). The PORT moves the LAN to 172.16.52.0/24 so it does NOT
# clash with usb0 (NetHunter USB tether = 172.16.42.1/24, the SSH lifeline):
#   - interface = br-lan, bind only there
#   - DHCP pool 172.16.52.100 - 172.16.52.250
#   - gateway (option 3) and DNS (option 6) = 172.16.52.1 (the Pineapple)
#
# Runtime files live under /opt so nothing touches the OS.

# Serve only on the Pineapple bridge; never listen on the phone's interfaces.
interface=br-pager
bind-interfaces
except-interface=lo

# Do not read /etc/resolv.conf or /etc/hosts of the host (self-contained).
no-resolv
no-hosts
no-poll

# Upstream resolvers used when the daemon answers victim queries (matches the
# original LAN dns 1.1.1.1 / 1.0.0.1).
server=1.1.1.1
server=1.0.0.1

# DHCP: pool + lease time; advertise the Pineapple as gateway and DNS.
dhcp-range=172.16.52.100,172.16.52.250,255.255.255.0,12h
dhcp-option=3,172.16.52.1
dhcp-option=6,172.16.52.1
dhcp-authoritative

# Self-contained state under /opt (NOT /var/lib/misc of the host).
dhcp-leasefile=/opt/pineapple-pager/run/dnsmasq.leases
pid-file=/opt/pineapple-pager/run/dnsmasq.pid

# Keep logs with the rest of the port.
log-facility=/var/log/pineapple-pager/dnsmasq.log
