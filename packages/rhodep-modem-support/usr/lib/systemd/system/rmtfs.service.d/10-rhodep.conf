# Drop-in: does not replace Alpine's unit, only changes its arguments.
#
# rmtfs needs these flags on rhodep, otherwise the modem never finishes init:
#   -P  usar particiones reales (by-partlabel) en vez de archivos
#   -s  sincronizar al salir
#
# CORRECTED 2026-09-05. This file used to pass -r as well, with the comment
# "-r  read/write the modem's EFS partitions". That is the opposite of what -r
# does: rmtfs.c:526 sets read_only = true for -r, so it makes the EFS
# read-ONLY, backed by a RAM shadow whose writes are acknowledged and then
# thrown away. `userspace/modem/install.sh` has always deliberately omitted it,
# and its /etc drop-in wins over this one, so nothing was broken in practice on
# this device -- but on any device where THIS drop-in is the only one, the
# modem's UIM provisioning session would stop persisting across reboots and the
# SIM would need re-provisioning on every boot.
#
# The empty ExecStart clears the inherited one; without it systemd rejects the
# tener dos ExecStart en un servicio Type=simple.
[Service]
ExecStart=
ExecStart=/usr/bin/rmtfs -P -s
