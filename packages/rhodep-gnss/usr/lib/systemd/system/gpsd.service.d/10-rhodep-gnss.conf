# Point gpsd at rhodep-gnss-daemon.
#
# gpsd cannot read a UNIX socket, only serial devices and tcp://|udp:// URLs,
# which is the whole reason the daemon serves TCP as well as the socket that
# geoclue wants.
#
# These Environment= lines beat the DEVICES=/GPSD_OPTIONS= in
# /etc/default/gpsd: drop-ins are merged after the main unit, so they are
# applied after its EnvironmentFile=. The postinst also writes the same values
# into /etc/default/gpsd when that file is still at its pristine default, so
# that gpsd started by hand behaves the same way.

[Unit]
After=rhodep-gnss.service
Wants=rhodep-gnss.service
# Restart gpsd whenever its only source restarts.
#
# gpsd's NMEA driver learns which sentence ends a reporting cycle by watching
# timestamps, and that learned state lives for the life of the gpsd process,
# across TCP reconnects. Cutting and resuming the stream -- which is what a
# `systemctl restart rhodep-gnss` looks like from gpsd's side -- degrades it.
# MEASURED, 2026-09-05, after eight restarts of the daemon with gpsd left
# running:
#
#   70 s of `gpspipe -w`: 278 TPV, of which 70 had mode 1 (no fix)
#
# i.e. one TPV in four claimed no position while the stream was carrying a
# perfectly good 22 m fix at 1 Hz. A client that simply reads the newest TPV
# saw "no fix" a quarter of the time. `systemctl restart gpsd` and nothing
# else: 134 TPV in 45 s, all mode 2, none without a fix. The same sentence
# set fed to a freshly started gpsd never produces a mode 1 at all, so this
# is accumulated parser state and not the sentences.
#
# PartOf= makes gpsd follow the restart, which is the honest relationship
# here: on this phone gpsd has exactly one device and it is rhodep-gnss.
PartOf=rhodep-gnss.service

[Service]
Environment=GPSD_OPTIONS=-n
Environment=DEVICES=tcp://127.0.0.1:2948
Environment=OPTIONS=
# A tcp:// source that is not listening yet makes gpsd give up on the device.
Restart=on-failure
RestartSec=10
