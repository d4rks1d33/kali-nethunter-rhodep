<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">

<!-- rhodep: stop anything asking ModemManager to turn the GNSS engine on.

     NOTE TO ANYONE EDITING THIS FILE. XML comments may not contain two
     consecutive hyphens, so no command line with long options can be written
     out here. dbus-daemon reports the parse error to the journal and then
     ignores the whole file, which means a broken comment silently removes the
     protection below while leaving the file sitting in place looking like it
     works. That happened once already. After any change, run

         systemctl reload dbus
         journalctl -b -u dbus | grep rhodep

     and confirm there is no "not well-formed" complaint. The full story, with
     the mmcli commands spelled out, is in
     /usr/share/doc/rhodep-gnss/README under "ModemManager is the other way
     in".

     WHY. On this SoC a GNSS measurement session in any operation mode except
     cellid power-cycles the phone within 100 ms. rhodep-gnss-daemon guards its
     own path with three gates. ModemManager reaches the same engine and is not
     guarded by anything. Its Location interface on this modem advertises
     3gpp-lac-ci, gps-raw, gps-nmea, agps-msa and agps-msb; the last four all
     reset the phone, and all of them are one Location.Setup call away from a
     settings panel, a phone shell's location toggle, geoclue's modem-gps
     source or a shell prompt. That is a latent way for the phone to reset
     itself with no deliberate action, which is what this file removes.

     MECHANISM. context="mandatory" is deliberate. D-Bus applies policy in the
     order default, then group, then user, then mandatory, and ModemManager's
     own policy ends by allowing user root to send anything to it. A
     default-context deny would therefore not bind root, and the accident being
     prevented is very much a root one.

     SCOPE. Only the three methods that can reach the measurement engine are
     denied. Location.GetLocation still works, so the 3GPP LAC/CI position
     ModemManager already holds stays readable. Location.SetGpsRefreshRate
     still works, because it is a daemon-side setting that touches no hardware.
     Every other ModemManager interface is untouched: data, SMS, voice, signal
     and registration are unaffected.

     WHAT THIS DOES NOT DO. ModemManager opens the QMI LOC service by itself
     while initialising a modem, to fill in the capability list above; the
     "couldn't load SUPL server" and "couldn't load supported assistance data
     types" warnings in its log are that probe. Those are LOC reads, they
     happen on every modem enumeration, there is no ModemManager configuration
     in 1.24 that disables them, and they have been observed on this phone
     several times with no reset. What can be controlled is how often a modem
     gets enumerated, which is what rhodep-qmi-proxy.service is for.

     TO UNDO, on a kernel where the GNSS reset has been fixed: delete this file
     and reload dbus.
  -->

<busconfig>
  <policy context="mandatory">
    <deny send_destination="org.freedesktop.ModemManager1"
          send_interface="org.freedesktop.ModemManager1.Modem.Location"
          send_member="Setup"/>

    <deny send_destination="org.freedesktop.ModemManager1"
          send_interface="org.freedesktop.ModemManager1.Modem.Location"
          send_member="InjectAssistanceData"/>

    <deny send_destination="org.freedesktop.ModemManager1"
          send_interface="org.freedesktop.ModemManager1.Modem.Location"
          send_member="SetSuplServer"/>
  </policy>
</busconfig>
